<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FLOATCHATAI – Try it Live</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 32px; max-width: 900px; }
      h1 { margin-bottom: 8px; }
      .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; }
      textarea { width: 100%; height: 100px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 10px; }
      button { padding: 10px 16px; font-weight: 600; cursor: pointer; }
      .out { white-space: pre-wrap; background: #0b1220; color: #e2e8f0; padding: 16px; border-radius: 10px; margin-top: 16px; }
      .ok { color: #16a34a; font-weight: 700; }
      .err { color: #dc2626; font-weight: 700; }
      .hint { color: #64748b; font-size: 13px; }
      .sql { background: #0f172a; padding: 12px; border-radius: 8px; overflow-x: auto; }
      .sql code { color: #a3e635; }
    </style>
  </head>
  <body>
    <h1>🌊 FLOATCHATAI – Try it live</h1>
    <p class="hint">Backend endpoint: <code id="ep">http://127.0.0.1:8001/chat</code></p>

    <div class="row">
      <textarea id="q">Monthly avg doxy and chla for Arabian Sea for last 6 months</textarea>
      <button id="ask">Ask</button>
    </div>

    <div id="status"></div>
    <div id="out" class="out" style="display:none"></div>

    <script>
      const endpoint = "http://127.0.0.1:8001/chat";
      const askBtn = document.getElementById('ask');
      const qEl = document.getElementById('q');
      const out = document.getElementById('out');
      const status = document.getElementById('status');

      askBtn.addEventListener('click', async () => {
        out.style.display = 'none';
        out.textContent = '';
        status.innerHTML = '⏳ Sending…';
        try {
          const resp = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: qEl.value })
          });
          if (!resp.ok) {
            const t = await resp.text();
            throw new Error(`HTTP ${resp.status}: ${t}`);
          }
          const json = await resp.json();
          status.innerHTML = json.ok ? '<span class="ok">✓ ok</span>' : '<span class="err">✗ not ok</span>';

          const parts = [];
          if (json.answer_markdown) parts.push(json.answer_markdown);
          if (json.sql) parts.push('\n\n<div class="sql"><code>' + json.sql.replace(/</g,'&lt;') + '</code></div>');
          if (json.rows) parts.push('\n\n' + JSON.stringify(json.rows, null, 2));
          if (json.error) parts.push('\n\nError: ' + json.error);

          out.innerHTML = parts.join('\n');
          out.style.display = 'block';
        } catch (e) {
          status.innerHTML = `<span class="err">✗ Request failed</span>`;
          out.textContent = String(e);
          out.style.display = 'block';
          console.error(e);
        }
      });
    </script>
  </body>
</html>
