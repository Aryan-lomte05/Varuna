version: '3.8'

services:
  # Database for Structured Data and PostGIS
  postgres:
    image: postgis/postgis:15-3.4
    container_name: oceanmind_postgres
    environment:
      POSTGRES_USER: argo_admin
      POSTGRES_PASSWORD: argo_password
      POSTGRES_DB: argo_data
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argo_admin -d argo_data"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vector Store for Hybrid Search
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: oceanmind_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # KV Store for Sessions and Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: oceanmind_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Node.js API Gateway (Reverse Proxy + Auth + WS Tunnel)
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: oceanmind_gateway
    environment:
      - NODE_ENV=production
      - PORT=4000
      - PYTHON_BACKEND_URL=http://api:8000
    ports:
      - "4000:4000"
    depends_on:
      - api

  # Python ASGI Backend (FastAPI + RAG Engine)
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: oceanmind_api
    environment:
      - POSTGRES_URL=postgresql://argo_admin:argo_password@postgres:5432/argo_data
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=argo_profiles
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # We use host.docker.internal to reach the local Ollama instance running on the host Windows/Mac machine
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started

  # Next.js Frontend App
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: oceanmind_web
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:4000
      - NEXT_PUBLIC_GATEWAY_WS_URL=ws://localhost:4000
      # Ensure Mapbox token is passed from the host environment
      - NEXT_PUBLIC_MAPBOX_TOKEN=${NEXT_PUBLIC_MAPBOX_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  pg_data:
  qdrant_data:
  redis_data:
